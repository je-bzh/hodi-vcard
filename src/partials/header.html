<header class="header">
	<div class="shell">
		<div class="header__inner">
			<a href="https://hodi.host/" class="btn btn--blue" data-i18n="header.visit_hodi">
				<img src="public/assets/images/svg/ico-btn-1.svg" alt="">
				Visit Hodi.host
			</a><!-- /.btn -->

			<a href="mes-infos.html" class="logo js-logo-link" data-i18n-aria-label="footer.logo_label" aria-label="Hodi vCard">
				<picture>
					<source media="(max-width:767px)" srcset="public/assets/images/svg/logo.svg">
					<img src="public/assets/images/svg/logo.svg" alt="Hodi vCard">
				</picture>
			</a><!-- /.logo -->

			<label class="header__lang">
				<span class="header__lang-icon" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
						<circle cx="12" cy="12" r="10"/>
						<path d="M2 12h20"/>
						<path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/>
					</svg>
				</span>
				<select class="js-lang-switcher" data-i18n-aria-label="header.lang_label" aria-label="Language">
					<!-- options injectées par lang-switcher.js -->
				</select>
			</label>
		</div><!-- /.header__inner -->
	</div><!-- /.shell -->
</header><!-- /.header -->
