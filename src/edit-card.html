<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Redirecting - Hodi vCard</title>
	<meta http-equiv="refresh" content="0; url=card#modifier">
	<link rel="canonical" href="card#modifier">
</head>
<body>
	<script>
		// JS redirect in case the meta refresh doesn't fire
		window.location.replace('card#modifier');
	</script>
	<noscript>
		<p>If you are not redirected automatically, <a href="card#modifier">click here</a>.</p>
	</noscript>
</body>
</html>
