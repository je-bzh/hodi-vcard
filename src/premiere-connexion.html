<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Redirection — Hodi vCard</title>
	<meta http-equiv="refresh" content="0; url=mes-infos.html">
	<link rel="canonical" href="mes-infos.html">
</head>
<body>
	<script>
		// Redirection JS au cas où la meta refresh ne se déclenche pas.
		// La création et l'édition de vCard sont fusionnées sur mes-infos.html
		// (mode détecté automatiquement selon que l'utilisateur a déjà une vCard ou non).
		window.location.replace('mes-infos.html');
	</script>
	<noscript>
		<p>Si vous n'êtes pas redirigé automatiquement, <a href="mes-infos.html">cliquez ici</a>.</p>
	</noscript>
</body>
</html>
